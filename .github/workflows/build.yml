name: build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

# New repositories default GITHUB_TOKEN to read-only; the release step needs write.
permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Paper 26.3 is compiled for Java 25; javac 21 cannot read its classes.
      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
          cache: maven

      - name: Build
        run: mvn -B -DskipTests package

      - name: Upload jar
        uses: actions/upload-artifact@v4
        with:
          name: ProbeGuard-jar
          path: target/ProbeGuard-*.jar
          if-no-files-found: error

      # Pushing a tag like v1.0.0 publishes a release with the jar attached.
      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: target/ProbeGuard-*.jar
          generate_release_notes: true
